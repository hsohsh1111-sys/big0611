spring.application.name=homepick

# LiveReload 서버 활성화
spring.devtools.livereload.enabled=true

# TiDB / MySQL 연결 설정 (.env 및 환경변수 참조)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:4000}/${DB_NAME:homepick}?sslMode=VERIFY_IDENTITY&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Thymeleaf 설정
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# 서버 포트 설정 (클라우드 환경변수 PORT 우선 적용)
server.port=${PORT:8080}
