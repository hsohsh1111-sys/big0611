<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Q&A 게시판 - Homepick</title>
    <!-- 공통 CSS 및 Q&A 게시판 전용 CSS 연결 -->
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/qna.css}">
</head>
<body>

    <!-- 헤더 조각 (common.css 스타일 적용) -->
    <div th:replace="~{common/header :: header}"></div>

    <!-- Q&A 게시판 본문 (qna.css 스타일 적용) -->
    <div class="hero-header">
        <h1>💬 Q&A 게시판</h1>
        <p>부동산 관련 궁금한 점을 물어보세요.</p>
    </div>

    <div class="qna-container">
        
        <div class="sub-header">
            <div class="count-text">
                총 <span th:text="${totalCount}">0</span>개 질문
            </div>
            <a th:href="@{/qna/write}" class="btn-write">
                ✏️ 질문 작성
            </a>
        </div>

        <div class="board-card">
            <table>
                <thead>
                    <tr>
                        <th style="text-align: center;">번호</th>
                        <th>제목</th>
                        <th style="text-align: center;">작성자</th>
                        <th style="text-align: center;">상태</th>
                        <th style="text-align: center;">작성일</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="qna : ${qnaList}">
                        <td class="col-id" th:text="${qna.id}">1</td>
                        <td class="col-title" th:text="${qna.title}">전세 계약 시 주의할 점이 있나요?</td>
                        <td class="col-writer" th:text="${qna.writer}">user1</td>
                        <td class="col-status">
                            <span th:if="${qna.status == '답변완료'}" class="badge badge-done">✔ 답변완료</span>
                            <span th:if="${qna.status == '대기중'}" class="badge badge-wait">⌛ 대기중</span>
                        </td>
                        <td class="col-date" th:text="${#temporals.format(qna.createdAt, 'yyyy.MM.dd')}">2026.06.22</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- 푸터 조각 (common.css 스타일 적용) -->
    <div th:replace="~{common/footer :: footer}"></div>

</body>
</html>
