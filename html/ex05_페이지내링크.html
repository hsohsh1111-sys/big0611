<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지 내부 링크</title>
    <style>
        section {height: 100px; background: orange;}
        section: :nth-of-type(1) {background: lightblue;}
        section: :nth-of-type(2) {background: lightgreen;}
        section: :nth-of-type(3) {background: lightcoral;}
        footer {height: 100px; background: #111}
    </style>
</head>
<body>
    <header style="height: 95px; background: white;">헤더</header>
    <section>비디오</section>
    <section>탭</section>
    <section>패럴랙스 스크롤링</section>
    <footer>푸터</footer>
</body>
</html>
