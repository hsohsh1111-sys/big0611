<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 요소의 Display 타입</title>
    <base href="">
    <link>
    <noscript></noscript>
    <script></script>
    <style></style>
    <template></template>
</head>

<body>
    <!-- display: block;
        1. 자동 줄바꿈(배치: 위->아래)
        2. 한 줄 전체 차지
        3. width, height, 상하좌우 margin/padding 모두 적용
    -->
    <h1></h1>
    <h2></h2>
    <h3></h3>
    <h4></h4>
    <h5></h5>
    <h6></h6>
    <hgroup></hgroup>

    <details></details>

    <article></article>
    <aside></aside>
    <nav></nav>
    <section></section>

    <address></address>
    <blockquote></blockquote>

    <div></div>
    <dl></dl>
    <dt></dt>
    <dd></dd>
    <fieldset></fieldset>
    <figure></figure>
    <figcaption></figcaption>
    <footer></footer>
    <form></form>
    <header></header>
    <hr>
    <main></main>
    <menu></menu>
    <ol></ol>
    <p></p>
    <pre></pre>
    <search></search>
    <ul></ul>


    <!-- display: list-item; -->
    <li></li>

    <!-- display: inline; 
        1. 줄바꿈 없음(배치: 왼쪽->오른쪽)
        2. 콘텐츠 크기만큼만 차지 
        3. width, height, 상하 margin 적용 안 됨
        4. 상하좌우 padding이 적용된다.
        5. margin은 좌우만 적용된다.
    -->

    <canvas></canvas>
    <embed src="" type="">
    <iframe src="" frameborder="0"></iframe>
    <!-- 예외적으로 img 태그는 width, height가 적용된다. -->
    <img src="" alt="">
    <object data="" type=""></object>
    <picture></picture>
    <svg></svg>
    <video src=""></video>
    
    <a href=""></a>
    <keygen>
    <label for=""></label>
    <abbr title=""></abbr>
    <area shape="" coords="" href="" alt="">
    <b></b>
    <bdi></bdi>
    <bdo dir=""></bdo>
    <br>
    <cite></cite>
    <code></code>
    <data value=""></data>
    <del></del>
    <dfn></dfn>
    <em></em>
    <i></i>
    <ins></ins>
    <kbd></kbd>
    <map name=""></map>
    <mark></mark>
    <output></output>
    <q></q>
    <sub></sub>
    <sup></sup>
    <time datetime=""></time>
    <u></u>
    <var></var>
    <wbr></wbr>


    <!-- display: inline-block;
        1. 대부분 폼 컨트롤 및 대체 요소
        2. 줄바꿈 없이 나란히 배치(가로 배치: 왼->오)
        3. width, height, 상하좌우 margin 모두 설정 가능
    -->
        
    <button></button>
    <input type="text">
    <select name="" id=""></select>
    <textarea name="" id=""></textarea>
    <meter value=""></meter>
    <progress></progress>   


    <!-- display: math; -->
    <math></math>
    <!-- display: ruby; -->
    <ruby></ruby>


    <!-- display: none;
            - 화면에 렌더링되지 않고 공간도 차지하지 않음
            - 이벤트x, 트랜지션/애니메이션x
                <head></head>
                <meta>
                <script></script>
                <style></style>
                <link>
                <title></title>

        visibility: hidden;
            - 화면에 렌더링되고 공간도 차지한다.
            - 이벤트x, 트랜지션/애니메이션 제한적
        opacity: 0;
            - 화면에 렌더링되고 공간도 차지한다.
            - 이벤트o, 트랜지션/애니메이션o
    -->

    <audio src=""></audio>
    <dialog></dialog>
    <datalist></datalist>
    <script></script>

    <!-- 테이블(표) 계열 -->
    <!-- display: table; -->
    <table>
        <!-- display: table-caption; -->
        <caption></caption>
        <!-- display: table-column-group; -->
        <colgroup>
            <!-- display: table-column; -->
            <col>
            <col>
        </colgroup>
        <!-- display: table-header-group; -->
        <thead>
            <!-- display: table-row; -->
            <tr>
                <!-- display: table-cell; -->
                <th></th>
            </tr>
        </thead>
        <tbody>
            <!-- display: table-row-group; -->
            <tr>
                <!-- display: table-cell; -->
                <td></td>
            </tr>
        </tbody>
        <!-- display: table-footer-group; -->
        <tfoot>
            <tr>
                <td></td>
            </tr>
        </tfoot>
    </table>

</body>

</html>
