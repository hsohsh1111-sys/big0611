<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>폼요소</title>
</head>
<body>
    
    <label for="이름"></label>
    <input type="text" id="이름"> 한줄 문장 (단어)
    <textarea>여러 줄 문장</textarea>
    
    <input type="submit">
    <button type="submit">로그인</button>


    목록 상자: 목록에서 선택만 가능
    <select>
        <optgroup>
            <option>항목1</option>
            <option>항목2</option>
            <option>항목3</option>
        </optgroup>
    </select>
    콤보 상자:목록에서 선택 및 입력 가능 
    <input type="text">
    <datalist>
        <optgroup>
            <option>항목1</option>
            <option>항목2</option>
            <option>항목3</option>
        </optgroup>
    </datalist>


    <fieldset></fieldset>
    <legend></legend>    
    <output></output>
    

</body>
</html>
